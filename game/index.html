<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — An open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1b26; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hidden { display: none !important; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #eef1f5; }
  #objective { position: absolute; top: 16px; left: 16px; max-width: 340px; padding: 10px 14px; background: rgba(0,0,0,.55); border-left: 4px solid #ff9a3d; border-radius: 6px; font-size: 14px; line-height: 1.4; }
  #wanted { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 26px; letter-spacing: 4px; color: #ffd23d; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  #cash { position: absolute; top: 16px; right: 16px; font-size: 26px; font-weight: 800; color: #7dff9a; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  #health { position: absolute; top: 52px; right: 16px; width: 180px; height: 12px; background: rgba(0,0,0,.55); border-radius: 6px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #2fae62, #7dff9a); }
  #minimap { position: absolute; left: 16px; bottom: 16px; width: 180px; height: 180px; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); background: #0d1b26; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(10,20,40,.82), rgba(40,10,40,.82)); color: #eef1f5; z-index: 10; }
  .screen h1 { margin: 0; font-size: 84px; font-weight: 900; letter-spacing: 6px; color: #ffd23d; text-shadow: 0 0 24px rgba(255,90,154,.8), 0 4px 0 rgba(0,0,0,.4); }
  .screen h2 { margin: 8px 0 24px; font-size: 22px; font-weight: 600; color: #dfeef5; }
  .screen p { margin: 6px 0; font-size: 16px; color: #dfeef5; }
  .screen .controls { margin: 18px 0; font-size: 14px; line-height: 1.9; color: #b9c9d4; }
  .screen button { pointer-events: auto; margin-top: 14px; padding: 12px 34px; font-size: 18px; font-weight: 700; color: #111; background: #ffd23d; border: none; border-radius: 8px; cursor: pointer; }
  .screen button.secondary { background: transparent; color: #ffd23d; border: 2px solid #ffd23d; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Neon Bay: an open-world crime game. Move with WASD, run with Shift, drag to look around."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud" class="hidden">
  <div id="objective">Talk to Vera at the garage. First mission coming soon.</div>
  <div id="wanted">☆☆☆☆☆</div>
  <div id="cash">$0</div>
  <div id="health"><div id="health-fill"></div></div>
  <canvas id="minimap" width="180" height="180"></canvas>
</div>
<div id="title" class="screen">
  <h1>NEON BAY</h1>
  <h2>An open-world crime game</h2>
  <p>Press Enter to start</p>
  <div class="controls">
    WASD move &middot; Shift run &middot; E enter car &middot; F punch<br>
    Space handbrake &middot; P pause &middot; M mute &middot; Drag mouse to look around
  </div>
  <button id="start-btn" type="button">Start</button>
  <button id="continue-btn" class="secondary hidden" type="button">Continue</button>
</div>
<div id="paused" class="screen hidden">
  <h1>PAUSED</h1>
  <p>Press P or Enter to keep playing.</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
